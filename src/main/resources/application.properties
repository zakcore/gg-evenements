spring.application.name=gg-evenements

# --- Base de données MySQL (exécuter database/schema.sql puis database/donnees.sql) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/gg_evenements?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Le schéma est créé par le script SQL fourni ; Hibernate se contente de le valider au démarrage.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# --- Téléversement des affiches (la limite de 5 Mo est vérifiée par FichierService) ---
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
app.uploads.dir=uploads

# --- Erreurs : pages Thymeleaf personnalisées (templates/error/*.html), jamais la page blanche ---
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never

server.port=8080

# Le DaoAuthenticationProvider est volontairement déclaré (vérification du mot de passe avant l'état du compte)
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
