<!DOCTYPE html>
<html lang="fr-CA" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Page introuvable</title></head>
<body>
<div layout:fragment="content">
    <section class="error-page">
        <div class="error-page__code">404</div>
        <h1>Page introuvable</h1>
        <p th:text="${message != null and !#strings.isEmpty(message) ? message : 'La page ou la ressource demandée n’existe pas, ou elle a été déplacée.'}">La page ou la ressource demandée n’existe pas, ou elle a été déplacée.</p>
        <div class="actions">
            <a class="btn btn--primary" th:href="@{/evenements}"><i class="ph-bold ph-calendar-dots"></i>Retour aux événements</a>
            <a class="btn btn--secondary" href="javascript:history.back()">Page précédente</a>
        </div>
    </section>
</div>
</body>
</html>
