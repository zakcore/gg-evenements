<!DOCTYPE html>
<html lang="fr-CA" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title th:text="${lieu.id == null} ? 'Nouveau lieu' : 'Modifier le lieu'">Lieu</title></head>
<body>
<div layout:fragment="content" style="max-width: 640px; margin: 0 auto"
     th:with="action=${lieu.id == null} ? @{/admin/lieux/nouveau} : @{/admin/lieux/{id}/modifier(id=${lieu.id})}">

    <a class="back" th:href="@{/admin/referentiels}"><i class="ph-bold ph-arrow-left"></i>Retour aux catégories et lieux</a>

    <header class="page-head">
        <div class="page-head__text">
            <span class="eyebrow">Administration · Lieux</span>
            <h1 class="title" th:text="${lieu.id == null} ? 'Nouveau lieu' : 'Modifier le lieu'">Nouveau lieu</h1>
        </div>
    </header>

    <form class="form-card" th:action="${action}" th:object="${lieu}" method="post" novalidate>
        <div class="field">
            <label class="label" for="nom">Nom <span class="req" aria-hidden="true">*</span></label>
            <input class="input" id="nom" th:field="*{nom}" maxlength="80" required
                   th:classappend="${#fields.hasErrors('nom')} ? 'is-invalid'" placeholder="ex. Salle polyvalente B-110">
            <p th:replace="~{fragments/ui :: erreur('nom')}"></p>
        </div>
        <div class="form-grid">
            <div class="field">
                <label class="label" for="campus">Campus <span class="req" aria-hidden="true">*</span></label>
                <input class="input" id="campus" th:field="*{campus}" maxlength="50" required list="campus-connus"
                       th:classappend="${#fields.hasErrors('campus')} ? 'is-invalid'" placeholder="ex. Campus principal">
                <datalist id="campus-connus"><option value="Pavillon principal"><option value="Pavillon sportif"><option value="Pavillon des arts"><option value="Hors campus"></datalist>
                <p th:replace="~{fragments/ui :: erreur('campus')}"></p>
            </div>
            <div class="field">
                <label class="label" for="capaciteMax">Capacité maximale <span class="req" aria-hidden="true">*</span></label>
                <input class="input" type="number" id="capaciteMax" th:field="*{capaciteMax}" min="1" step="1" required inputmode="numeric"
                       th:classappend="${#fields.hasErrors('capaciteMax')} ? 'is-invalid'" placeholder="ex. 80">
                <p th:replace="~{fragments/ui :: erreur('capaciteMax')}"></p>
            </div>
        </div>
        <div class="field">
            <label class="label" for="adresse">Adresse <span class="req" aria-hidden="true">*</span></label>
            <input class="input" id="adresse" th:field="*{adresse}" maxlength="150" required
                   th:classappend="${#fields.hasErrors('adresse')} ? 'is-invalid'" placeholder="15615, boulevard Gouin Ouest, Montréal">
            <p th:replace="~{fragments/ui :: erreur('adresse')}"></p>
        </div>
        <div class="form-actions">
            <a class="btn btn--ghost" th:href="@{/admin/referentiels}">Retour</a>
            <button class="btn btn--primary" type="submit"><i class="ph-bold ph-check"></i>Enregistrer</button>
        </div>
    </form>
</div>
</body>
</html>
